apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-flyway-sql
  labels:
    app.kubernetes.io/name: migration-flyway
    app.kubernetes.io/instance: migration-flyway
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: auth-platform
    app.kubernetes.io/managed-by: kustomize
data:
  V1__init_auth_server_schema.sql: |
    CREATE SCHEMA IF NOT EXISTS auth_server;

    CREATE TABLE IF NOT EXISTS auth_server.users (
        id           bigserial PRIMARY KEY,
        email        text NOT NULL,
        display_name text,
        created_at   timestamptz NOT NULL DEFAULT now()
    );

    CREATE UNIQUE INDEX IF NOT EXISTS idx_auth_server_users_email
        ON auth_server.users (lower(email));
