apiVersion: v1
kind: Service
metadata:
  name: test-server-3
  labels:
    app.kubernetes.io/name: test-server-3
    app.kubernetes.io/instance: test-server-3
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: test-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: test-server-3
    app.kubernetes.io/instance: test-server-3
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
    - name: metrics
      port: 8081
      targetPort: metrics
      protocol: TCP
      appProtocol: http
