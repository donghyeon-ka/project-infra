apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
      protocol: TCP
      appProtocol: http
    - name: metrics
      port: 44180
      targetPort: metrics
      protocol: TCP
      appProtocol: http
