apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mnt

resources:
  - ../../../base/app/storage/minio/stateful/minio
  - vault-secrets.yaml
  - networkpolicy.yaml

patches:
  - target:
      group: minio.min.io
      version: v2
      kind: Tenant
      name: minio
    patch: |-
      - op: replace
        path: /spec/certConfig/dnsNames
        value:
          - minio
          - minio-hl
          - minio.mnt.svc.cluster.local
          - "*.minio-hl.mnt.svc.cluster.local"
