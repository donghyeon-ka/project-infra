apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mnt

resources:
  - ../../../base/app/identity/keycloak/stateless/keycloak
  - vault-secrets.yaml
  - networkpolicy.yaml

patches:
  - target:
      kind: ConfigMap
      name: keycloak-config
    patch: |-
      - op: add
        path: /data/KC_HOSTNAME
        value: https://keycloak.dev.example.com
      - op: add
        path: /data/KC_HOSTNAME_ADMIN
        value: https://keycloak-admin.dev.example.com
