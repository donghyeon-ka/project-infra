apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-public
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/version: "26.6.1"
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: auth-platform
    app.kubernetes.io/managed-by: kustomize
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.options: kube-system-modern-tls@kubernetescrd # kube-system namespace에 있는 modern-tls라는 이름의 Traefik TLSOption CRD를 사용
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-security-headers@kubernetescrd # 응답 처리 중간에 적용할 Traefik middleware 목록
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - keycloak.dev.example.com
      secretName: keycloak-dev-example-com-tls
  rules:
    - host: keycloak.dev.example.com
      http:
        paths:
          - path: /realms/
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
          - path: /resources/
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
          - path: /.well-known/
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
          - path: /js/
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
