apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-server-allow-intra
  labels:
    app.kubernetes.io/name: test-server
    app.kubernetes.io/instance: test-server
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: test-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: test-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: test-platform
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: test-platform
