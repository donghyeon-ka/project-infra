apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mnt

resources:
  - ../../../base/app/test/stateless/test-server-1
  - ../../../base/app/test/stateless/test-server-2
  - ../../../base/app/test/stateless/test-server-3
  - networkpolicy.yaml

images:
  - name: registry.example.com/test-platform/test-server-1
    newName: registry.project.com/test-platform/test-server-1
    newTag: 0.1.0
  - name: registry.example.com/test-platform/test-server-2
    newName: registry.project.com/test-platform/test-server-2
    newTag: 0.1.0
  - name: registry.example.com/test-platform/test-server-3
    newName: registry.project.com/test-platform/test-server-3
    newTag: 0.1.0

patches:
  - target:
      kind: ServiceAccount
      name: test-server-1-sa
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
          - name: docker-registry-pull-credentials
  - target:
      kind: ServiceAccount
      name: test-server-2-sa
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
          - name: docker-registry-pull-credentials
  - target:
      kind: ServiceAccount
      name: test-server-3-sa
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
          - name: docker-registry-pull-credentials
