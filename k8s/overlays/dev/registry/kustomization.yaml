apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mnt

resources:
  - ../../../base/plugins/docker-registry
  - networkpolicy.yaml

patches:
  - target:
      kind: StatefulSet
      name: docker-registry
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
